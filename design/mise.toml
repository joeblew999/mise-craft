# Lineage: written by hand. The design-time pipeline. design/ holds what you edit (apps.json) and the
# stages below; everything they produce lands at the repo root, where runtime reads it. The pipeline
# never reads the state of the machine.
#
#   stage        task       reads                  writes
#   1 fetch      fetch      GitHub, apps.json      apps.json (the upstream blocks only)
#   2 edit       (you)                             apps.json (everything else)
#   3 validate   validate   apps.json              nothing: stops the pipeline if an entry can't work
#   4 generate   generate   apps.json              ../mise.toml, ../.mcp.json, ../mcp-live.json
#   5 lock       lock       ../mise.toml           ../mise.lock
#
# Each of stages 3-5 depends on the one before it, so running any of them runs the earlier ones
# first, in order: `mise run lock` validates and generates before it locks. `gen` runs all three.
# fetch stands apart: it reaches the network and brings in outside changes, so it only runs when
# asked, and you review what it changed before running gen.

[tasks.fetch]
description = "Stage 1: refresh each app's upstream block in apps.json from GitHub. Review the changes, then run gen."
run = "./fetch"

[tasks.validate]
description = "Stage 3: stop before anything is written if a checked app in apps.json can't produce a working live server."
run = '''
jq -e '[.apps[] | select(.mcp.live) | select(
    (.bundle | not) or
    ((.mcp.opens_itself | not) and .bundle.name != .bundle.executable + ".app")
  ) | .id] | if length == 0 then true else error("checked apps need a bundle whose name is the executable plus .app (scripts/mcp-open-app.sh opens and finds the app by that one name): \(join(", "))") end' \
  apps.json >/dev/null
'''

[tasks.generate]
description = "Stage 4: apps.json -> the root's mise.toml, .mcp.json and mcp-live.json."
depends = ["validate"]
run = "./generate"

[tasks.lock]
description = "Stage 5: lock exactly the downloads the new ../mise.toml names, in ../mise.lock."
depends = ["generate"]
dir = "{{config_root}}/.."
run = "mise lock"

[tasks.gen]
description = "Stages 3-5, in order: validate apps.json, generate the root's files from it, lock."
depends = ["lock"]
