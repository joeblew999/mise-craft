[tasks."cadcraft:watch"]
description = "Let Claude drive the CADCraft desktop app while you watch: adds its live MCP server to Claude Code for this project. Undo with cadcraft:unwatch."
run = "mise run apps:watch cadcraft"

[tasks."cadcraft:unwatch"]
description = "Remove CADCraft's live MCP server from Claude Code."
run = "mise run apps:unwatch cadcraft"

[tasks."cadcraft:install"]
description = "Install CADCraft 0.13.0: its CLI (cadcraft-cli, with the MCP server) and desktop app. Undo with cadcraft:uninstall."
run = "mise run apps:install cadcraft"

[tasks."cadcraft:uninstall"]
description = "Uninstall CADCraft: every installed version of its CLI and desktop app, unregistered from macOS."
