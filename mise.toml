# Generated by design/scripts/5-config-generate from design/family.json and design/apps.json: edit those, then run
# `mise run config:build` in design/.
#
# Lineage:
#   generated by   design/scripts/5-config-generate from design/family.json and design/apps.json, run by `mise run config:build`
#                  in design/
#   read by        mise
#   tasks run      <app>:install / <app>:uninstall -> mise-tasks/apps/install / uninstall
#                  <app>:watch / <app>:unwatch     -> mise-tasks/apps/watch / unwatch
#   postinstall    each desktop app tool runs scripts/dmg-unpack.sh
#
# Each Craft app's GitHub repo is installed twice under aliases: `<app>-cli` (the CLI, with its MCP
# server) and `<app>` (the desktop app). Each alias gets its own install directory. macOS only for
# now: it's the one platform every app publishes a CLI for.
#
# Every app is listed, but nothing downloads until you name it: `mise run cadcraft:install`.
# (A bare `mise install` still installs them all.)

[settings]
# Don't install missing tools behind your back: not when .mcp.json starts a server with
# `mise exec`, not on `mise run`, and not when a shell can't find a command.
exec_auto_install = false
task.run_auto_install = false
not_found_auto_install = false

[tool_alias]
cadcraft-cli = "github:storytold/cadcraft"
cadcraft = "github:storytold/cadcraft"
deckcraft-cli = "github:storytold/deckcraft"
deckcraft = "github:storytold/deckcraft"
designcraft-cli = "github:storytold/designcraft"
designcraft = "github:storytold/designcraft"
effectcraft-cli = "github:storytold/effectcraft"
effectcraft = "github:storytold/effectcraft"
figcraft-cli = "github:storytold/figcraft"
figcraft = "github:storytold/figcraft"
filmcraft-cli = "github:storytold/filmcraft"
filmcraft = "github:storytold/filmcraft"
gridcraft-cli = "github:storytold/gridcraft"
gridcraft = "github:storytold/gridcraft"
lightcraft-cli = "github:storytold/lightcraft"
lightcraft = "github:storytold/lightcraft"
pdfcraft-cli = "github:storytold/pdfcraft"
pdfcraft = "github:storytold/pdfcraft"
photocraft-cli = "github:storytold/photocraft"
